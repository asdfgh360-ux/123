<style>
#confidencePill{display:none!important}
.generatedModelFrame{margin:16px auto 0;border:1px solid #e7e8f5;border-radius:20px;overflow:hidden;background:#fff;padding:10px;box-shadow:0 8px 30px rgba(61,57,120,.06);max-width:790px}
.generatedModelFrame img{display:block;width:min(100%,720px);height:auto;margin:0 auto;border-radius:14px;background:#fafaff;object-fit:contain;image-rendering:auto}
.singleExplain{margin:12px 0 0;grid-template-columns:1fr!important}.singleExplain>div{background:#f7f8ff!important;border:1px solid #e2e5f6!important}.singleExplain b{font-size:16px!important;color:#5146d9}.singleExplain span{margin-top:7px!important;display:block!important;line-height:1.75!important}
.modelLoadError{padding:70px 20px;text-align:center;color:#8a90a9;background:#f8f9ff;border-radius:14px}
.modelZoom{position:fixed;inset:0;background:rgba(17,18,35,.84);z-index:99999;display:none;align-items:center;justify-content:center;padding:40px}.modelZoom.show{display:flex}.modelZoom img{max-width:94vw;max-height:84vh;border-radius:18px;background:#fff;box-shadow:0 25px 80px rgba(0,0,0,.35)}.modelZoomClose{position:absolute;right:28px;top:20px;width:46px;height:46px;border:0;border-radius:50%;font-size:30px;cursor:pointer}.zoomHint{position:absolute;bottom:18px;color:#fff;font-size:13px;opacity:.8}

/* 只出现在“认识这本书”的作品视觉导读 */
.introBookVisual{position:relative;min-height:220px;border-radius:26px;overflow:hidden;background:linear-gradient(118deg,#29235f 0%,#393280 46%,#5b4ad7 100%);display:grid;grid-template-columns:150px 1fr 270px;align-items:center;gap:24px;padding:28px 30px;margin-bottom:18px;color:#fff;box-shadow:0 18px 45px rgba(45,39,112,.18)}
.introBookVisual:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 76% 30%,rgba(255,255,255,.13),transparent 28%),linear-gradient(180deg,transparent 60%,rgba(12,13,51,.25));pointer-events:none}
.introCover{position:relative;z-index:2;width:118px;height:158px;border-radius:8px;background:linear-gradient(#f7f0d7,#fffaf0);box-shadow:0 14px 30px rgba(0,0,0,.22);color:#2e2b55;text-align:center;padding:14px 8px;transform:rotate(-2deg)}
.coverTiny{font-size:9px;letter-spacing:.5px;opacity:.72}.coverAnimals{font-size:34px;margin:23px 0 13px}.coverAnimals span{font-size:26px}.coverCn{font-size:17px;font-weight:800}
.introVisualText{position:relative;z-index:2}.introVisualEyebrow{font-size:13px;color:#dedaff;margin-bottom:8px}.introVisualTitle{font-size:38px;font-weight:900;letter-spacing:1px;margin-bottom:14px}.introVisualMeta{display:flex;gap:8px;flex-wrap:wrap}.introVisualMeta span{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.12);padding:7px 11px;border-radius:999px;font-size:12px}.introVisualQuote{margin-top:18px;font-size:14px;line-height:1.7;color:#eeeaff;max-width:560px}
.introScene{position:relative;z-index:1;height:180px}.moon{position:absolute;right:35px;top:12px;width:58px;height:58px;border-radius:50%;background:#f1e8ff;box-shadow:0 0 45px rgba(229,214,255,.55)}.barn{position:absolute;right:100px;bottom:8px;font-size:116px;line-height:1;color:#171746;opacity:.7}.pigSil{position:absolute;right:40px;bottom:7px;font-size:54px;filter:brightness(.75)}.spiderSil{position:absolute;right:155px;top:44px;font-size:31px}.webLines{position:absolute;right:2px;top:4px;font-size:90px;opacity:.18;transform:rotate(28deg)}

/* 真正的“路线地图” */
.mapCardV5{overflow:hidden}.routeMapV5{height:390px;position:relative;margin-top:20px;border-radius:24px;background:linear-gradient(180deg,#f9fbff,#f5f2ff);border:1px solid #e6e4f7;overflow:hidden}.routeMapV5:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(126,108,255,.08),transparent 23%),radial-gradient(circle at 75% 75%,rgba(250,194,74,.10),transparent 24%)}.routeMapV5 svg{position:absolute;inset:0;width:100%;height:100%}.routeMapV5 path{fill:none;stroke:#8b7cf7;stroke-width:6;stroke-linecap:round;stroke-dasharray:10 11}.routeMapV5 circle{fill:#5c4ee6;stroke:#fff;stroke-width:4}.routeStopV5{position:absolute;transform:translate(-50%,-50%);z-index:2;width:170px}.routePin{display:flex;align-items:center;gap:7px}.routePin span{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 8px 22px rgba(82,69,204,.18);font-size:22px;border:2px solid #e1ddff}.routePin b{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:#5c4ee6;color:#fff;font-size:12px}.routeLabel{margin-top:7px;background:rgba(255,255,255,.94);border:1px solid #e6e3f7;padding:10px 11px;border-radius:14px;box-shadow:0 8px 20px rgba(73,63,157,.08)}.routeLabel strong{font-size:13px;line-height:1.45;display:block}.routeLabel small{font-size:11px;line-height:1.45;color:#777f9d;display:block;margin-top:4px}.routeStart,.routeFinish{position:absolute;font-size:11px;color:#6d62da;font-weight:800}.routeStart{left:3%;bottom:24%}.routeFinish{right:3%;bottom:28%}.mapTipV5{margin-top:14px;background:#fff8dc;border:1px solid #f5df86;border-radius:14px;padding:12px 15px;color:#76652a;font-size:13px}

/* 3:4阅读作品 */
.posterWrapV5{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:12px}.posterPreviewV5{position:relative;width:min(100%,540px);aspect-ratio:3/4;border-radius:24px;overflow:hidden;background:linear-gradient(145deg,#29235f,#5747dc);padding:32px;color:#fff;box-shadow:0 22px 60px rgba(57,48,160,.20)}.posterPreviewV5:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-80px;top:-60px;background:rgba(255,255,255,.08)}.posterTopV5{display:flex;justify-content:space-between;font-size:11px;color:#d9d5ff;position:relative;z-index:2}.posterPreviewV5 h3{font-size:34px;margin:28px 0 8px;position:relative;z-index:2}.posterQuestionV5{color:#ffdc73;font-weight:800;font-size:16px;position:relative;z-index:2}.posterArtV5{height:105px;position:relative;margin-top:12px}.pigV5{position:absolute;left:12%;bottom:10px;font-size:55px}.spiderV5{position:absolute;right:13%;bottom:10px;font-size:43px}.webV5{position:absolute;left:50%;transform:translateX(-50%);top:8px;font-size:62px;opacity:.65}.posterActionsV5{display:grid;gap:8px;position:relative;z-index:2}.posterActionsV5>div{display:grid;grid-template-columns:32px 1fr;gap:9px;align-items:center;background:rgba(255,255,255,.12);padding:9px 12px;border-radius:13px;font-size:12px;line-height:1.5}.posterActionsV5 i{font-style:normal;width:25px;height:25px;border-radius:8px;background:#fff;color:#4f43d3;display:grid;place-items:center;font-weight:900}.posterReasonV5{margin-top:13px;padding-top:13px;border-top:1px solid rgba(255,255,255,.18);font-size:12px;line-height:1.65}.posterReasonV5 b{color:#ffdc73}.posterReasonV5 p{margin:5px 0 0}.posterBrandV5{position:absolute;right:28px;bottom:22px;font-size:12px;font-weight:800;letter-spacing:.5px}.downloadPosterV5{border:0;background:#5c4ee6;color:#fff;font-weight:800;border-radius:13px;padding:12px 20px;cursor:pointer;box-shadow:0 8px 20px rgba(92,78,230,.2)}.saveHintV5{font-size:12px;color:#8a90a9}

@media(max-width:980px){.introBookVisual{grid-template-columns:110px 1fr}.introScene{display:none}.introVisualTitle{font-size:30px}.routeMapV5{height:auto;padding:18px;display:grid;gap:12px}.routeMapV5 svg,.routeStart,.routeFinish{display:none}.routeStopV5{position:static;transform:none;width:auto;display:grid;grid-template-columns:60px 1fr;align-items:center}.routeLabel{margin-top:0}.layout{grid-template-columns:1fr!important}.chat{position:static!important}}
