<script>
function replaceLegacyThinkingMapText(){
  const root=document.getElementById('workspace');
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{if(n.nodeValue&&n.nodeValue.includes('AI思维地图'))n.nodeValue=n.nodeValue.replaceAll('AI思维地图','思维模型')});
}
window.addEventListener('load',()=>{
  setTimeout(()=>{
    const p=demoCharlotte();
    state={plan:p,grade:3,toolAnswers:{},chat:[],thoughtReflection:{},discussionDone:{}};
    openWorkspace();
    replaceLegacyThinkingMapText();
    new MutationObserver(replaceLegacyThinkingMapText).observe(document.getElementById('workspace'),{subtree:true,childList:true,characterData:true});
  },100);
});
</script>
